name: Release

on:
  push:
    tags:
      - "v1.*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  security:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level high

  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
          - platform: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:js
      - run: pnpm run build:prebuild
      - run: pnpm run test:stable
      - run: pnpm run package:check
      - run: pnpm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: release-prebuild-${{ matrix.platform }}
          path: prebuilds
          if-no-files-found: error

  source-fallback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: rm -rf prebuilds
      - run: npm_config_build_from_source=true pnpm run build:native
      - run: pnpm run build:js
      - run: pnpm run test:stable
      - name: Install source-only tarball as a consumer
        shell: bash
        run: |
          npm pack --ignore-scripts
          test_dir="$(mktemp -d)"
          cp lightdrift-libraw-*.tgz "$test_dir/package.tgz"
          cd "$test_dir"
          npm init -y
          npm_config_build_from_source=true npm install ./package.tgz
          node -e "const sdk = require('lightdrift-libraw'); if (sdk.LibRaw.version() !== '0.22.2') process.exit(1)"

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: LD_PRELOAD="$(gcc -print-file-name=libasan.so)" ASAN_OPTIONS=detect_leaks=0 VITEST_TEST_TIMEOUT=300000 pnpm run test:stable
      - run: LD_PRELOAD="$(gcc -print-file-name=libasan.so)" ASAN_OPTIONS=detect_leaks=0 node scripts/test-malformed-child.js

  package:
    needs: [prebuild, source-fallback, sanitizers, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-prebuild-*
          path: prebuilds
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:js
      - name: Verify tag matches package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: pnpm run docs:check
      - run: REQUIRE_ALL_PREBUILDS=1 pnpm run package:check
      - run: pnpm run test:package
      - run: npm pack --ignore-scripts
      - name: Generate and validate CycloneDX SBOM
        run: |
          pnpm dlx @cyclonedx/cdxgen@12.7.0 -t js --no-install-deps --required-only --fail-on-error --no-babel --spec-version 1.6 -o lightdrift-libraw-sbom.json .
          node -e "const fs=require('node:fs'); const bom=JSON.parse(fs.readFileSync('lightdrift-libraw-sbom.json','utf8')); if (bom.bomFormat !== 'CycloneDX' || bom.metadata?.component?.name !== 'lightdrift-libraw' || !Array.isArray(bom.components)) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            lightdrift-libraw-*.tgz
            lightdrift-libraw-sbom.json
          if-no-files-found: error

  consumer:
    name: Release tarball consumer Node ${{ matrix.node }}
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install and run CJS and ESM without install scripts
        shell: bash
        run: |
          test_dir="$(mktemp -d)"
          cp lightdrift-libraw-*.tgz "$test_dir/package.tgz"
          cd "$test_dir"
          npm init -y
          npm install --ignore-scripts ./package.tgz
          node -e "const sdk = require('lightdrift-libraw'); const Legacy = require('lightdrift-libraw/legacy'); if (sdk.LibRaw.version() !== '0.22.2' || typeof new Legacy().close !== 'function') process.exit(1)"
          node --input-type=module -e "import { LibRaw } from 'lightdrift-libraw'; import Legacy from 'lightdrift-libraw/legacy'; if (LibRaw.version() !== '0.22.2' || typeof new Legacy().close !== 'function') process.exit(1)"

  publish:
    needs: [package, consumer]
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Select npm dist-tag
        id: dist
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish lightdrift-libraw-*.tgz --access public --provenance --tag "${{ steps.dist.outputs.tag }}"
